---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: repositories.borgbase.clevyr.com
spec:
  group: borgbase.clevyr.com
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    singular: repository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.repositoryID
      name: Repo ID
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.initialized
      name: Initialized
      type: boolean
    - jsonPath: .status.currentUsage
      name: Usage
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Repository is the Schema for the repositories API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Repository
            properties:
              alertDays:
                description: |-
                  alertDays makes BorgBase alert when the repository has not been written
                  to for this many days. Unset leaves the account default.
                format: int32
                minimum: 0
                type: integer
              apiTokenSecretRef:
                description: |-
                  apiTokenSecretRef overrides the operator's default BorgBase API token.
                  Use it to point a repository at a different BorgBase account.
                properties:
                  key:
                    description: The key of the secret to select from.  Must be a
                      valid secret key.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  optional:
                    description: Specify whether the Secret or its key must be defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              appendOnly:
                description: |-
                  appendOnly prevents clients from deleting existing data, which protects
                  backups from a compromised host. `restic forget --prune` cannot run against
                  an append-only repository.
                type: boolean
              deletionPolicy:
                default: Retain
                description: |-
                  deletionPolicy controls whether deleting this resource also deletes the
                  BorgBase repository. Retain is strongly preferred: Delete destroys every
                  snapshot in the repository and cannot be undone.
                enum:
                - Retain
                - Delete
                type: string
              existingRepositoryID:
                description: |-
                  existingRepositoryID adopts an already-existing BorgBase repository by
                  its opaque ID (for example "a1b2c3d4"). When set, the operator only ever
                  looks the repository up; it will never create one, and it will never
                  generate a password. This is the migration path.

                  The field is immutable: repointing a Repository at a different BorgBase
                  repo would silently orphan the original backups.
                pattern: ^[a-z0-9]{4,32}$
                type: string
                x-kubernetes-validations:
                - message: existingRepositoryID is immutable
                  rule: self == oldSelf
              interval:
                default: 1h
                description: |-
                  interval is how often to re-reconcile against the BorgBase API, which
                  also refreshes usage and quota in the status.
                type: string
              passwordSecretRef:
                description: |-
                  passwordSecretRef seeds the restic encryption password from an existing
                  Secret instead of generating one. Required when adopting a repository
                  that already holds snapshots, since the original password is the only
                  way to read them.

                  The operator reads this Secret and never writes to it, so it remains a
                  disaster-recovery copy of the password.
                properties:
                  key:
                    description: The key of the secret to select from.  Must be a
                      valid secret key.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  optional:
                    description: Specify whether the Secret or its key must be defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              quotaGiB:
                description: quotaGiB caps repository size in GiB. Unset means no
                  quota.
                format: int32
                minimum: 1
                type: integer
              region:
                default: us
                description: |-
                  region is the BorgBase region a new repository is created in. Ignored
                  when adopting.
                type: string
              repositoryName:
                description: |-
                  repositoryName is the name given to a newly created BorgBase repository.
                  Defaults to the namespace of this resource. Ignored when adopting.
                maxLength: 64
                type: string
              secretName:
                description: |-
                  secretName is the Secret the operator writes RESTIC_REPOSITORY and
                  RESTIC_PASSWORD into. Defaults to "<name>-borgbase".
                maxLength: 253
                type: string
              suspend:
                description: suspend pauses reconciliation of this resource.
                type: boolean
            type: object
          status:
            description: status defines the observed state of Repository
            properties:
              adopted:
                description: adopted reports whether this repository was adopted rather
                  than created.
                type: boolean
              conditions:
                description: conditions represent the current state of the Repository
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentUsage:
                description: currentUsage is the repository size reported by BorgBase.
                type: string
              initialized:
                description: initialized reports whether `restic init` has succeeded.
                type: boolean
              observedGeneration:
                description: observedGeneration is the .metadata.generation this status
                  was computed from.
                format: int64
                type: integer
              quota:
                description: quota is the configured size cap, if any.
                type: string
              repositoryID:
                description: |-
                  repositoryID is the BorgBase repository ID. Recording it here is the
                  point of the operator: it makes the app-to-repo mapping visible without
                  decrypting anything.
                type: string
              secretName:
                description: secretName is the Secret the credentials were written
                  to.
                type: string
              server:
                description: server is the BorgBase host serving this repository.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: passwordSecretRef is required when adopting an existing repository,
            otherwise its snapshots would be unreadable
          rule: '!has(self.spec.existingRepositoryID) || has(self.spec.passwordSecretRef)'
    served: true
    storage: true
    subresources:
      status: {}
