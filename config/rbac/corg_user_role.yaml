# Permissions for people running the corg CLI.
#
# The manager's own role does not cover this: it never reads pods, never execs,
# and cannot delete a PersistentVolumeClaim. corg runs as the user, so it needs
# its own grant.
#
# Bind corg-operator to someone who runs backups and restores, or corg-viewer
# to someone who should only be able to look.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: borgbase-operator
    app.kubernetes.io/managed-by: kustomize
  name: corg-viewer
rules:
  - apiGroups:
      - borgbase.clevyr.com
    resources:
      - repositories
      - scheduledbackups
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - borgbase.clevyr.com
    resources:
      - repositories/status
      - scheduledbackups/status
    verbs:
      - get
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - get
      - list
      - watch
  # corg logs, and finding the pod of a run.
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
  # Why a pod cannot start. A missing Secret keeps it Pending with nothing in
  # any container status; the reason exists only as an event.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
---
# Everything the viewer can do, plus the ability to run backups and restores.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: borgbase-operator
    app.kubernetes.io/managed-by: kustomize
  name: corg-operator
rules:
  # Triggering a backup and suspending a schedule are annotation and spec
  # patches; reinit patches status.
  - apiGroups:
      - borgbase.clevyr.com
    resources:
      - repositories
      - scheduledbackups
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - borgbase.clevyr.com
    resources:
      - repositories/status
      - scheduledbackups/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - get
      - list
      - watch
  # corg cancel deletes a running Job; the ephemeral runner creates its own.
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
  # corg shell and the streaming restore both exec into the runner's pod.
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
  # corg restore --to-new-pvc creates a staging claim; delete lets it be
  # cleaned up afterwards.
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  # RESTIC_REPOSITORY and RESTIC_PASSWORD, read by corg env and written by
  # corg rotate-password. This is the repository's encryption key: bind
  # corg-operator only to people who should hold it.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - patch
      - update
      - delete
